# coturn production template — do not put real credentials in this file.
# Localhost-only LiveKit development does not require TURN.

listening-port=3478
fingerprint
lt-cred-mech
realm=turn.example.invalid
server-name=turn.example.invalid

# Configure these only in the deployed secret/config layer:
# user=<username>:<password>
# external-ip=<public-ip>/<private-ip>
# cert=/path/to/fullchain.pem
# pkey=/path/to/privkey.pem

# Restrict relay range according to firewall/network policy.
min-port=49160
max-port=49200

# Conservative hardening baseline.
no-multicast-peers
no-loopback-peers
stale-nonce
