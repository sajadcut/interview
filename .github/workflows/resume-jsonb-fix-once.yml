name: resume-jsonb-fix-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair resume JSONB persistence
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/api/src/resumes/resume-ingestion.service.ts")
          text = path.read_text(encoding="utf-8")
          dollar = "$" + "{"
          replacements = {
            dollar + 'JSON.stringify(embeddingMetadata)}::jsonb': dollar + 'tx.json(embeddingMetadata)}',
            dollar + 'serializedVector}::jsonb': dollar + 'tx.json(embeddingVector)}',
            dollar + 'JSON.stringify({ source: "resume", resumeId: input.resumeId })}::jsonb': dollar + 'tx.json({ source: "resume", resumeId: input.resumeId })}',
            dollar + 'JSON.stringify({ claimType: "skill", skillKey: skill.key, confidence: skill.confidence, resumeId: input.resumeId, chunkId: chunk?.id ?? null, parserVersion: input.profile.parserVersion })}::jsonb': dollar + 'tx.json({ claimType: "skill", skillKey: skill.key, confidence: skill.confidence, resumeId: input.resumeId, chunkId: chunk?.id ?? null, parserVersion: input.profile.parserVersion })}',
            dollar + 'JSON.stringify({ claimType: "experience", fingerprint: experience.fingerprint, confidence: experience.confidence, resumeId: input.resumeId, chunkId: chunk?.id ?? null, parserVersion: input.profile.parserVersion })}::jsonb': dollar + 'tx.json({ claimType: "experience", fingerprint: experience.fingerprint, confidence: experience.confidence, resumeId: input.resumeId, chunkId: chunk?.id ?? null, parserVersion: input.profile.parserVersion })}',
            dollar + 'JSON.stringify(input.profile)}::jsonb': dollar + 'tx.json(input.profile)}',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f"expected resume fragment missing: {old[:100]}")
            text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

          test_path = Path("apps/api/src/resumes/resume-ingestion.postgres.integration.spec.ts")
          test_text = test_path.read_text(encoding="utf-8")
          old = "SELECT count(*)::int AS count, min(dimensions)::int AS dimensions\n        FROM resume_chunk_embeddings"
          new = "SELECT count(*)::int AS count, min(dimensions)::int AS dimensions,\n               bool_and(jsonb_typeof(embedding) = 'array') AS all_arrays\n        FROM resume_chunk_embeddings"
          if old not in test_text:
            raise SystemExit("expected embedding aggregate query missing")
          test_text = test_text.replace(old, new)
          old_assert = "assert.equal(embeddingRows[0]?.dimensions, 3);"
          new_assert = "assert.equal(embeddingRows[0]?.dimensions, 3);\n      assert.equal(embeddingRows[0]?.all_arrays, true);"
          if old_assert not in test_text:
            raise SystemExit("expected dimensions assertion missing")
          test_text = test_text.replace(old_assert, new_assert)
          test_path.write_text(test_text, encoding="utf-8")
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/resumes/resume-ingestion.service.ts apps/api/src/resumes/resume-ingestion.postgres.integration.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(resumes): persist native jsonb values"
          git push
