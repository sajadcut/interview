name: resume-contract-sync-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install --global npm@11.6.2 --ignore-scripts
      - name: Update canonical dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact lock
        run: npm ci
      - name: Regenerate OpenAPI and typed client
        env:
          DATABASE_URL: postgres://unused:unused@127.0.0.1:5432/unused
        run: npm run api:sync
      - name: Commit generated dependency and API contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json openapi/openapi.json packages/api-client/src/generated/schema.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync resume ingestion contracts"
          git push
