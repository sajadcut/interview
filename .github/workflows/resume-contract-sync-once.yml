name: resume-contract-sync-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply typed JSON parameter fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/api/src/resumes/resume-ingestion.service.ts")
          text = path.read_text(encoding="utf-8")
          marker = "$" + "{{"
          replacements = {
            marker + ' source: "resume", resumeId: input.resumeId }}::jsonb': '$' + '{JSON.stringify({ source: "resume", resumeId: input.resumeId })}::jsonb',
            marker + ' claimType: "skill", skillKey: skill.key, confidence: skill.confidence, resumeId: input.resumeId, chunkId: chunk?.id ?? null, parserVersion: input.profile.parserVersion }}::jsonb': '$' + '{JSON.stringify({ claimType: "skill", skillKey: skill.key, confidence: skill.confidence, resumeId: input.resumeId, chunkId: chunk?.id ?? null, parserVersion: input.profile.parserVersion })}::jsonb',
            marker + ' claimType: "experience", fingerprint: experience.fingerprint, confidence: experience.confidence, resumeId: input.resumeId, chunkId: chunk?.id ?? null, parserVersion: input.profile.parserVersion }}::jsonb': '$' + '{JSON.stringify({ claimType: "experience", fingerprint: experience.fingerprint, confidence: experience.confidence, resumeId: input.resumeId, chunkId: chunk?.id ?? null, parserVersion: input.profile.parserVersion })}::jsonb',
            '$' + '{input.profile}::jsonb': '$' + '{JSON.stringify(input.profile)}::jsonb',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f"expected service fragment not found: {old[:60]}")
            text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: npm install --global npm@11.6.2 --ignore-scripts
      - name: Update canonical dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact lock
        run: npm ci
      - name: Regenerate OpenAPI and typed client
        env:
          DATABASE_URL: postgres://unused:unused@127.0.0.1:5432/unused
        run: npm run api:sync
      - name: Commit resume fixes and generated contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/resumes/resume-ingestion.service.ts package-lock.json openapi/openapi.json packages/api-client/src/generated/schema.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync resume ingestion contracts"
          git push
