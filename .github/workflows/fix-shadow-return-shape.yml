name: fix-shadow-return-shape

on:
  push:
    branches:
      - feat/shadow-testing-hardening-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shadow-testing-hardening-v2
          fetch-depth: 0
      - name: Align sealed return shape
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/interviews/evaluator-shadow-testing.service.ts')
          text = path.read_text()
          old = '''    return {
              ...base,
              visibilityState: "sealed",
              humanOutcomeRecorded: false,
              aiResult: null,
              comparison: null,
            };'''
          if old not in text:
              old = '''  return {
    ...base,
    visibilityState: "sealed",
    humanOutcomeRecorded: false,
    aiResult: null,
    comparison: null,
  };'''
          if old not in text:
              raise SystemExit('sealed return anchor not found')
          indent = '    ' if old.startswith('    return') else '  '
          new = old.replace('    comparison: null,\n', '    execution: null,\n    humanOutcome: null,\n    comparison: null,\n') if indent == '  ' else old.replace('              comparison: null,\n', '              execution: null,\n              humanOutcome: null,\n              comparison: null,\n')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-shadow-return-shape.yml
          git diff --check
      - name: Commit patch
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(shadow): keep run response shape stable"
          git push origin HEAD:feat/shadow-testing-hardening-v2
