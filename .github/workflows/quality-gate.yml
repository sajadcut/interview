name: quality-gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # GitHub can enqueue push events out of commit order. Scope concurrency to the
  # exact commit so a late/stale event can never cancel validation for a newer HEAD.
  group: quality-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://interview:interview@127.0.0.1:5432/interview
  AUTH_INTEGRATION_DATABASE_URL: postgresql://interview:interview@127.0.0.1:5432/interview
  CORS_ORIGIN: http://127.0.0.1:3000
  NEXT_PUBLIC_DEFAULT_LOCALE: en
  DEV_ORGANIZATION_NAME: Browser E2E Organization
  DEV_ORGANIZATION_SLUG: browser-e2e
  DEV_USER_EMAIL: browser.e2e@local.interview
  DEV_USER_DISPLAY_NAME: Browser E2E Recruiter
  DEV_USER_PASSWORD: BrowserE2e!2026#Secure
  E2E_USER_EMAIL: browser.e2e@local.interview
  E2E_USER_PASSWORD: BrowserE2e!2026#Secure

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
          POSTGRES_DB: interview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: |
          npm install --global npm@11.6.2 --ignore-scripts
          test "$(npm --version)" = "11.6.2"

      - name: Validate migration contracts
        run: node scripts/check-migrations.mjs

      - name: Verify frontend contract usage
        run: npm run web:contracts

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify operational indexes
        run: npm run db:performance

      - name: Regenerate OpenAPI and typed client
        run: npm run api:sync

      - name: Upload generated contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: generated-contracts
          path: |
            package-lock.json
            openapi/openapi.json
            packages/api-client/src/generated/schema.ts
          if-no-files-found: error

      - name: Verify generated contracts are committed
        run: git diff --exit-code -- openapi/openapi.json packages/api-client/src/generated/schema.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck browser E2E sources
        run: npm run e2e:typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Seed deterministic browser fixtures
        run: npm run e2e:seed

      - name: Install Playwright browser engines
        run: npm run e2e:install

      - name: Browser E2E critical flows
        run: npm run e2e

      - name: Upload browser E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
