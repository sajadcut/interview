name: quality-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://interview:interview@127.0.0.1:5432/interview
  AUTH_INTEGRATION_DATABASE_URL: postgresql://interview:interview@127.0.0.1:5432/interview

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
          POSTGRES_DB: interview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Validate migration contracts
        run: node scripts/check-migrations.mjs

      - name: Rebuild dependency lockfile from public registry
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Regenerate OpenAPI and typed client
        run: npm run api:sync

      - name: Upload generated contracts
        uses: actions/upload-artifact@v4
        with:
          name: generated-contracts
          path: |
            package-lock.json
            openapi/openapi.json
            packages/api-client/src/generated/schema.ts
          if-no-files-found: error

      - name: Verify generated contracts are committed on pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- package-lock.json openapi/openapi.json packages/api-client/src/generated/schema.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit deterministic generated contracts on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- package-lock.json openapi/openapi.json packages/api-client/src/generated/schema.ts; then
            echo "Generated contracts already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json openapi/openapi.json packages/api-client/src/generated/schema.ts
          git commit -m "chore: sync generated contracts"
          git push
