name: refresh-lock-temp

on:
  push:
    branches: [main]
    paths:
      - package.json
      - apps/api/package.json
      - .github/workflows/refresh-lock-temp.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: |
          npm install --global npm@11.6.2 --ignore-scripts
          test "$(npm --version)" = "11.6.2"
      - name: Rebuild canonical lockfile from package contracts
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Verify patched production dependency audit
        run: npm audit --omit=dev --audit-level=high
