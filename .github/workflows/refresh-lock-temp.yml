name: refresh-lock-temp

on:
  push:
    branches: [main]
    paths:
      - package.json
      - apps/api/package.json
      - .github/workflows/refresh-lock-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          registry-url: https://registry.npmjs.org
      - name: Pin npm
        run: |
          npm install --global npm@11.6.2 --ignore-scripts
          test "$(npm --version)" = "11.6.2"
      - name: Rebuild canonical lockfile from package contracts
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Verify patched production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Publish canonical lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh canonical lockfile"
          git push origin HEAD:main
