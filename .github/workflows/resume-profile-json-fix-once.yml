name: resume-profile-json-fix-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair profile JSON typing
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/api/src/resumes/resume-ingestion.service.ts")
          text = path.read_text(encoding="utf-8")
          old = "$" + "{tx.json(input.profile)}"
          new = "$" + "{tx.json(JSON.parse(JSON.stringify(input.profile)))}"
          if old not in text:
            raise SystemExit("expected profile json helper missing")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/resumes/resume-ingestion.service.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(resumes): normalize profile for json persistence"
          git push
