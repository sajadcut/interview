name: sync-generated-pr7

on:
  push:
    branches: [feat/supervised-pilot-controls]

permissions:
  contents: write

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://interview:interview@127.0.0.1:5432/interview
  AUTH_INTEGRATION_DATABASE_URL: postgresql://interview:interview@127.0.0.1:5432/interview
  CORS_ORIGIN: http://127.0.0.1:3000

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
          POSTGRES_DB: interview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/supervised-pilot-controls
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: |
          npm install --global npm@11.6.2 --ignore-scripts
          test "$(npm --version)" = "11.6.2"

      - name: Install locked dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Regenerate canonical contracts
        run: npm run api:sync

      - name: Commit generated contracts
        run: |
          git add openapi/openapi.json packages/api-client/src/generated/schema.ts
          if git diff --cached --quiet; then
            echo "Generated contracts already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(api): sync generated contracts"
          git push origin HEAD:feat/supervised-pilot-controls
