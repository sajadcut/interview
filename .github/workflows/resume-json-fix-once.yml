name: resume-json-fix-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch structured profile decoding
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/api/src/resumes/resume-ingestion.service.ts")
          text = path.read_text(encoding="utf-8")
          old = '''function mapResumeRow(row: ResumeRow): ResumeDto {
  const profile = row.structured_profile && typeof row.structured_profile === "object"
    ? row.structured_profile
    : { email: null, phone: null, location: null, preferredLanguage: null, currentRole: null, currentCompany: null, skills: [], experiences: [], parserVersion: "" };
  return {'''
          new = '''function mapResumeRow(row: ResumeRow): ResumeDto {
  const profile = decodeStructuredProfile(row.structured_profile);
  return {'''
          if old not in text:
              raise SystemExit("mapResumeRow profile fragment not found")
          text = text.replace(old, new)
          anchor = '''function mapResumeRow(row: ResumeRow): ResumeDto {'''
          helper = '''function decodeStructuredProfile(value: unknown): ResumeDto["structuredProfile"] {
  const empty: ResumeDto["structuredProfile"] = {
    email: null,
    phone: null,
    location: null,
    preferredLanguage: null,
    currentRole: null,
    currentCompany: null,
    skills: [],
    experiences: [],
    parserVersion: "",
  };
  if (!value) return empty;
  if (typeof value === "object") return value as ResumeDto["structuredProfile"];
  if (typeof value !== "string") return empty;
  try {
    const parsed: unknown = JSON.parse(value);
    return parsed && typeof parsed === "object"
      ? parsed as ResumeDto["structuredProfile"]
      : empty;
  } catch {
    return empty;
  }
}

'''
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/resumes/resume-ingestion.service.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: decode persisted resume profiles"
          git push
