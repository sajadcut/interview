name: core-contract-sync-once

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://interview:interview@127.0.0.1:5432/interview

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: interview
          POSTGRES_PASSWORD: interview
          POSTGRES_DB: interview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interview -d interview"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: |
          npm install --global npm@11.6.2 --ignore-scripts
          test "$(npm --version)" = "11.6.2"

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install synchronized dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Regenerate API contracts
        run: npm run api:sync

      - name: Commit exact generated artifacts
        run: |
          if git diff --quiet -- package-lock.json openapi/openapi.json packages/api-client/src/generated/schema.ts; then
            echo "Core generated artifacts are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json openapi/openapi.json packages/api-client/src/generated/schema.ts
          git commit -m "chore: sync core generated artifacts"
          git push
