name: Temporary phase 3 PR OpenAPI sync
on:
  pull_request:
permissions:
  contents: write
jobs:
  sync-pr:
    if: github.event.pull_request.head.ref == 'feat/phase3-adaptive-skill-planner-20261028' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase3-adaptive-skill-planner-20261028
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 25.9.0
          cache: npm
      - run: npm install --global npm@11.6.2 --ignore-scripts
      - run: npm ci
      - run: npm run api:sync
      - name: Commit contracts to feature branch
        run: |
          set -euo pipefail
          if git diff --quiet -- openapi/openapi.json packages/api-client/src/generated/schema.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi/openapi.json packages/api-client/src/generated/schema.ts
          git commit -m "chore(api): synchronize Phase 3 adaptive-plan contract"
          git push origin HEAD:refs/heads/feat/phase3-adaptive-skill-planner-20261028
