name: resume-ui-wire-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire resume UI and permission
        shell: python
        run: |
          from pathlib import Path

          access_path = Path("apps/web/components/product/internal-access.tsx")
          access = access_path.read_text(encoding="utf-8")

          replacements = [
              (
                  '  | "candidate.score"\n  | "sourcing.run"',
                  '  | "candidate.score"\n  | "candidate.resume_manage"\n  | "sourcing.run"',
              ),
              (
                  '  "candidate.score",\n  "sourcing.run",',
                  '  "candidate.score",\n  "candidate.resume_manage",\n  "sourcing.run",',
              ),
              (
                  '    "candidate.score",\n    "sourcing.run",',
                  '    "candidate.score",\n    "candidate.resume_manage",\n    "sourcing.run",',
              ),
          ]
          for old, new in replacements:
              if old not in access:
                  raise SystemExit(f"expected permission fragment missing: {old}")
              access = access.replace(old, new, 1)
          access_path.write_text(access, encoding="utf-8")

          workspace_path = Path("apps/web/components/recruiting/candidate-intelligence-workspace.tsx")
          workspace = workspace_path.read_text(encoding="utf-8")
          import_anchor = 'import { Panel, Pill } from "../product/recruiting-ui";'
          import_line = 'import { ResumeIngestionPanel } from "./resume-ingestion-panel";'
          if import_line not in workspace:
              if import_anchor not in workspace:
                  raise SystemExit("candidate workspace import anchor missing")
              workspace = workspace.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          experience_anchor = '          <Panel className="p-5">\n            <h2 className="text-[13px] font-semibold">Experience</h2>'
          panel = '''          <ResumeIngestionPanel
            candidateId={candidateId}
            identity={identity}
            applicationId={selectedApplicationId}
            onIngested={() => load(identity)}
          />

'''
          if panel.strip() not in workspace:
              if experience_anchor not in workspace:
                  raise SystemExit("candidate workspace experience anchor missing")
              workspace = workspace.replace(experience_anchor, panel + experience_anchor, 1)
          workspace_path.write_text(workspace, encoding="utf-8")
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/components/product/internal-access.tsx apps/web/components/recruiting/candidate-intelligence-workspace.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(web): wire resume ingestion into candidate workspace"
          git push
