name: run-shadow-response-patch

on:
  push:
    branches:
      - feat/shadow-testing-hardening-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shadow-testing-hardening-v2
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch-shadow-stable-response.py
      - name: Commit patch
        run: |
          rm -f scripts/patch-shadow-stable-response.py
          rm -f .github/workflows/run-shadow-response-patch.yml
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(shadow): stabilize run response contract"
          git push origin HEAD:feat/shadow-testing-hardening-v2
