name: resume-fix-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch resume ingestion implementation
        shell: python
        run: |
          from pathlib import Path

          service = Path("apps/api/src/resumes/resume-ingestion.service.ts")
          text = service.read_text(encoding="utf-8")
          old = '          current_role = COALESCE(current_role, ${input.profile.currentRole}),' 
          new = '          "current_role" = COALESCE("current_role", ${input.profile.currentRole}),' 
          if old not in text:
              raise SystemExit("current_role SQL fragment not found")
          service.write_text(text.replace(old, new), encoding="utf-8")

          parser = Path("apps/api/src/resumes/resume-parser.ts")
          text = parser.read_text(encoding="utf-8")
          old = '      const heading = line.replace(date[0], "").replace(/[|,؛;]+$/g, "").trim();'
          new = '      const heading = line.replace(date[0], "").trim().replace(/[|,؛;]+$/g, "").trim();'
          if old not in text:
              raise SystemExit("experience heading cleanup fragment not found")
          parser.write_text(text.replace(old, new), encoding="utf-8")
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/resumes/resume-ingestion.service.ts apps/api/src/resumes/resume-parser.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: finalize resume persistence and parsing"
          git push
