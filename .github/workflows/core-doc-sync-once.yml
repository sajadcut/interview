name: core-doc-sync-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Synchronize architecture and project state
        env:
          OLD_REGISTRY_B64: 
          NEW_REGISTRY_B64: 
          PROJECTSTATE_B64: 
          OLD_READY_B64: 
          NEW_READY_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          def decode(name: str) -> str:
              return base64.b64decode(os.environ[name]).decode("utf-8")

          master = Path("master.md")
          text = master.read_text(encoding="utf-8")
          old_registry = decode("OLD_REGISTRY_B64")
          new_registry = decode("NEW_REGISTRY_B64")
          if old_registry not in text:
              raise SystemExit("master.md registry section did not match expected baseline")
          text = text.replace(old_registry, new_registry)
          text = text.replace("Dotin Nexus access", "Internet access to registry.npmjs.org")
          text = text.replace("Dotin Nexus required registry", "Public npm registry + deterministic committed package-lock.json")
          master.write_text(text, encoding="utf-8")

          Path("projectstate.md").write_text(decode("PROJECTSTATE_B64"), encoding="utf-8")

          readiness = Path("production-readiness.md")
          current = readiness.read_text(encoding="utf-8")
          old_ready = decode("OLD_READY_B64")
          new_ready = decode("NEW_READY_B64")
          if old_ready not in current:
              raise SystemExit("production-readiness current-state section did not match expected baseline")
          readiness.write_text(current.replace(old_ready, new_ready), encoding="utf-8")
          PY

      - name: Commit synchronized documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add master.md projectstate.md production-readiness.md
          if git diff --cached --quiet; then
            echo "Documents already synchronized."
            exit 0
          fi
          git commit -m "docs: sync core closure architecture state"
          git push
