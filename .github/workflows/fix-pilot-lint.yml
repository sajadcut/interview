name: fix-pilot-lint

on:
  push:
    branches: [feat/supervised-pilot-controls]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/supervised-pilot-controls
          fetch-depth: 0

      - name: Apply strict transaction typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/interviews/supervised-pilot.service.ts')
          text = path.read_text()
          marker = 'import { BadRequestException, Injectable, NotFoundException } from "@nestjs/common";\n'
          sql_import = 'import type { Sql } from "postgres";\n'
          if sql_import not in text:
              text = text.replace(marker, marker + sql_import, 1)
          text = text.replace('tx: any', 'tx: Sql')
          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git add apps/api/src/interviews/supervised-pilot.service.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(pilot): type postgres transactions"
          git push origin HEAD:feat/supervised-pilot-controls
