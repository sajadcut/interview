name: bootstrap-shadow-hardening-v2

on:
  push:
    branches:
      - feat/shadow-testing-hardening-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shadow-testing-hardening-v2
          fetch-depth: 0

      - name: Execute embedded hardening patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-shadow-hardening-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'PY')
          lines = source[start + 1:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code, 'shadow-hardening-v2-embedded.py', 'exec'))
          PY

          rm -f .github/workflows/bootstrap-shadow-hardening-v2.yml
          git diff --check

      - name: Commit hardening
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(shadow): harden prospective blind failure-aware validation"
          git push origin HEAD:feat/shadow-testing-hardening-v2
