packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# The active architecture decision pins local/CI runtime to Node.js 22.14+
# and below 23. Fail early on unsupported runtimes instead of allowing
# hard-to-diagnose install/build differences.
engineStrict: true

# pnpm 11 dependency-build policy. Keep this explicit: unknown dependency
# lifecycle scripts fail installation until reviewed.
strictDepBuilds: true
allowBuilds:
  esbuild: true
  "@scarf/scarf": false

# Dotin Nexus can be slower than the public registry; keep bounded retries
# without weakening TLS. The registry URL itself stays in .npmrc.
strictSsl: true
networkConcurrency: 4
fetchRetries: 5
fetchRetryFactor: 2
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 60000
fetchTimeout: 120000
